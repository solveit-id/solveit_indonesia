# Production gateway (compose.prod.yaml, service gateway): the only published service.
#   /api/* and /up  -> Laravel through FastCGI on backend:9000 (PHP-FPM is never published)
#   everything else -> the static frontend container on frontend:8080
# One origin serves the website and the API, so the browser needs no CORS for it. For a
# separate API origin (api.<domain>), see docs/development/docker-production.md.
# TLS is not configured here: no domain or certificate exists. Terminate TLS in front of this
# gateway (host reverse proxy or load balancer) or add a 443 server once the domain is decided.

server {
    listen 8080;
    server_name _;

    server_tokens off;
    absolute_redirect off;

    # Laravel rejects inquiry bodies above 64 KB with its own 413 JSON; this outer limit only
    # stops much larger bodies before they reach PHP.
    client_max_body_size 128k;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # Docker's embedded DNS, resolved per request: the gateway starts and recovers even while
    # a backend or frontend container is being replaced.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $solveit_backend backend:9000;
    set $solveit_frontend http://frontend:8080;

    # Behind another proxy or load balancer that terminates TLS, trust only its address so the
    # rate limit sees the visitor's IP (Laravel receives it as REMOTE_ADDR):
    #   set_real_ip_from <proxy-ip-or-cidr>;
    #   real_ip_header X-Forwarded-For;

    location = /up {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass $solveit_backend;
        access_log off;
    }

    location ^~ /api/ {
        # The admin API (B3.1a) is never served on this public listener, in any spelling:
        # case-insensitive, and nginx has already decoded %XX, resolved dot segments, and merged
        # slashes before matching. Nested, because the ^~ prefix above stops regex locations at
        # server level. Laravel refuses a non-admin Host on its own as well.
        location ~* ^/api/v1/admin {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 404 '{"message":"Not Found."}';
        }

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        # httpoxy: never let a client header become the PHP HTTP_PROXY variable.
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass $solveit_backend;
        fastcgi_read_timeout 30s;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location / {
        proxy_pass $solveit_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Container health check only (Dockerfile or Compose healthcheck). Port 8081 is never published,
# so this answer cannot be reached from outside the container.
server {
    listen 127.0.0.1:8081;
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}
