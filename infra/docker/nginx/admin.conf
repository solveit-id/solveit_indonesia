# Static admin console served by the admin production image (infra/docker/admin/Dockerfile).
# B3.2d, not deployed. A single-page application: every path that is not a file gets
# index.html (React Router renders its own "not found"), hashed assets are cached for a year,
# everything else is never stored. The browser security headers (CSP with frame-ancestors,
# Referrer-Policy same-origin, X-Frame-Options, nosniff, COOP, Permissions-Policy, X-Robots-Tag)
# are generated at build time from admin/security-policy.ts, the same definition the HTML meta
# CSP and the dev and preview servers use. Standalone: it never calls the backend; the private
# admin listener (nginx/admin-gateway.conf.template) puts /api/v1/admin next to it on one origin.

# Evaluated when the response headers are written, so a missing asset (404) is never cached.
# Assets are private: a shared cache or CDN has no reason to hold the admin code.
map "$status $uri" $solveit_admin_cache_control {
    "~^(200|304) /assets/"  "private, max-age=31536000, immutable";
    default                 "no-store";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    absolute_redirect off;
    charset utf-8;
    charset_types text/css text/plain application/javascript application/json image/svg+xml;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # Inherited by every location below (none adds headers of its own).
    include /etc/nginx/solveit/admin-security-headers.conf;
    add_header Cache-Control $solveit_admin_cache_control always;

    # Static files only: nothing here accepts a body.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}

# Container health check only (Dockerfile or Compose healthcheck). Port 8081 is never published,
# so this answer cannot be reached from outside the container.
server {
    listen 127.0.0.1:8081;
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}
