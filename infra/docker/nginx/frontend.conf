# Static website served by the frontend production image (infra/docker/frontend/Dockerfile).
# Same rules as frontend/scripts/serve.mjs and docs/development/development-guide.md (Deployment):
# clean URLs, the nearest 404.html with a real 404 status (en/404.html under /en/), long-lived
# caching for hashed assets, compression. Standalone: it never calls the backend, so the same
# image works behind the Compose gateway or any other reverse proxy or CDN.

map $uri $solveit_cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    absolute_redirect off;
    charset utf-8;
    charset_types text/css text/plain application/javascript application/json application/manifest+json image/svg+xml;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/xml application/javascript application/json application/manifest+json application/xml image/svg+xml;

    # Defined once here and inherited by every location below (no location adds its own headers).
    # HSTS belongs to whatever terminates TLS; no certificate exists yet.
    add_header Cache-Control $solveit_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location ^~ /en/ {
        error_page 404 /en/404.html;
        try_files $uri $uri/index.html =404;
    }

    location / {
        error_page 404 /404.html;
        try_files $uri $uri/index.html =404;
    }

    # Reachable only as error pages, never as a 200 response.
    location = /404.html { internal; }
    location = /en/404.html { internal; }
    location = /__spa-fallback.html { internal; }
}

# Container health check only (Dockerfile or Compose healthcheck). Port 8081 is never published,
# so this answer cannot be reached from outside the container.
server {
    listen 127.0.0.1:8081;
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}
