# Routes of the private admin listener, included by both server blocks of the admin host
# (nginx/admin-gateway.conf.template on 8080, nginx/admin-gateway-tls.conf.template on 8443).
# B3.2d, not deployed. One origin: the console and its API, so the browser needs no CORS and
# Laravel's AdminRequestBoundary sees the console's own Host and Origin, never a rewritten one.

server_tokens off;
absolute_redirect off;

# Admin requests are small JSON bodies; Laravel validates each field itself.
client_max_body_size 64k;
client_body_timeout 15s;

# Docker's embedded DNS, resolved per request: the listener starts and recovers while the
# backend or the console container is being replaced.
resolver 127.0.0.11 valid=10s ipv6=off;
set $solveit_backend backend:9000;
set $solveit_admin http://admin:8080;

location ^~ /api/v1/admin/ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param DOCUMENT_ROOT /var/www/html/public;
    # httpoxy: never let a client header become the PHP HTTP_PROXY variable.
    fastcgi_param HTTP_PROXY "";
    # REMOTE_ADDR already is the person's address (real_ip in the server block). Forwarded
    # headers are dropped, so they stay meaningless even if TRUSTED_PROXIES is ever set.
    fastcgi_param HTTP_X_FORWARDED_FOR "";
    fastcgi_param HTTP_X_FORWARDED_HOST "";
    fastcgi_param HTTP_X_FORWARDED_PORT "";
    fastcgi_param HTTP_X_FORWARDED_PROTO "";
    fastcgi_param HTTP_X_FORWARDED_PREFIX "";
    fastcgi_param HTTP_FORWARDED "";
    fastcgi_pass $solveit_backend;
    fastcgi_read_timeout 30s;

    # Laravel sets Cache-Control: no-store, private on every admin response.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security $solveit_admin_hsts always;

    # The backend did not answer: an uncertain outcome for the console (5xx, never retried).
    error_page 502 = @admin_api_unreachable;
    error_page 504 = @admin_api_timeout;
}

location @admin_api_unreachable {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security $solveit_admin_hsts always;
    return 502 '{"message":"The admin API is unavailable."}';
}

location @admin_api_timeout {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security $solveit_admin_hsts always;
    return 504 '{"message":"The admin API did not answer in time."}';
}

# Without this, nginx would answer the bare prefix with a 301 to /api/v1/admin/.
location = /api/v1/admin {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security $solveit_admin_hsts always;
    return 404 '{"message":"Not Found."}';
}

# Every other Laravel path in any spelling (/api/v1/inquiries, /API/V1/ADMIN/..., /up,
# /sanctum/...): the public API and the health check do not exist on the admin host. A regex,
# so the ^~ prefix above still wins for the real admin API.
location ~* ^/(api(/|$)|up$|sanctum(/|$)) {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security $solveit_admin_hsts always;
    return 404 '{"message":"Not Found."}';
}

# The static console, whose own security headers (CSP, Referrer-Policy, ...) pass through.
location / {
    proxy_pass $solveit_admin;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    add_header Strict-Transport-Security $solveit_admin_hsts always;
}
