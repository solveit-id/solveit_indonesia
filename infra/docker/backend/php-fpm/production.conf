; PHP-FPM pool overrides for production (infra/docker/backend/Dockerfile, target prod).
; Loaded after the image's www.conf and docker.conf (zz- sorts last). The container already runs
; as www-data, so the pool's user/group lines are ignored by FPM.

[global]
; Clean restarts: finish running requests for up to 20 s on SIGQUIT (compose stop_signal).
process_control_timeout = 20s

[www]
; Reachable only on the internal Compose network; never published to the host.
listen = 9000

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; Health check of the FPM process itself (Dockerfile HEALTHCHECK); not routed by the gateway.
ping.path = /fpm-ping
ping.response = pong

request_terminate_timeout = 60s
; Workers do not inherit the container environment: the configuration (including secrets)
; is read once by `php artisan optimize` in the entrypoint and cached.
clear_env = yes
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
