; Production PHP settings on top of php.ini-production (infra/docker/backend/Dockerfile, target prod).

; No version banner, no errors in responses; errors go to the container log.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; The API accepts at most 64 KB bodies (INQUIRY_MAX_BODY_BYTES); keep PHP's own limits low too.
post_max_size = 1M
upload_max_filesize = 1M
file_uploads = Off
max_execution_time = 30
memory_limit = 256M

; The code never changes inside a running container: cache it and never check timestamps.
; Deploying new code means a new image, so a restart is the only invalidation needed.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600

session.use_strict_mode = 1
session.cookie_httponly = 1
