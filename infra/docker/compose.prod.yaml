# Production-oriented, provider-independent Docker deployment of Solveit Indonesia for a
# Docker-capable VPS or container host. Prepared and validated locally and in CI; NOT deployed:
# no hosting, domain, certificate, or production database exists yet.
# Guide (secrets, first deploy, migrations, backup, rollback): docs/development/docker-production.md.
#
#   gateway        public nginx: static site + /api/* and /up over FastCGI; refuses /api/v1/admin
#   frontend       static prerendered site (nginx, no Node at runtime)
#   backend        Laravel on PHP-FPM, no dev packages, never published
#   migrate        one-off `php artisan migrate --force` as the migration user (profile ops)
#   mysql          optional MySQL 8.4 on this host (profile bundled-db); otherwise set DB_HOST to
#                  a managed MySQL 8.4 in the env file
#   admin          static admin console (nginx, no Node at runtime; profile admin, B3.2d)
#   admin-gateway  private admin listener: the console + /api/v1/admin over FastCGI on one
#                  origin, loopback only by default (profile admin, B3.2d). TLS in front of it,
#                  or in it with compose.prod.admin-tls.yaml
#
# Published ports: gateway (public website) and, only with --profile admin, admin-gateway. Both
# bind to loopback unless SOLVEIT_HTTP_BIND or SOLVEIT_ADMIN_BIND is set deliberately.
#
# Never put credentials in this file or in the env file: they are Docker secrets read from
# ${SOLVEIT_SECRETS_DIR:-./secrets}/ (ignored by Git).
name: solveit-indonesia-prod

x-hardened: &hardened
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-backend-env: &backend-env
  env_file:
    - path: ${SOLVEIT_ENV_FILE:-./production.env}
      required: true

# Laravel writes only here; the rest of the container is read-only. uid/gid 33 is www-data.
x-backend-tmpfs: &backend-tmpfs
  tmpfs:
    - /tmp:uid=33,gid=33,mode=0700
    - /var/www/html/storage:uid=33,gid=33,mode=0700
    - /var/www/html/bootstrap/cache:uid=33,gid=33,mode=0700

services:
  gateway:
    <<: *hardened
    image: nginxinc/nginx-unprivileged:1.30.6-alpine
    read_only: true
    cap_drop: [ALL]
    tmpfs:
      - /tmp
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    # Loopback by default. On a server, set SOLVEIT_HTTP_BIND to the address a TLS-terminating
    # proxy or load balancer reaches (docs/development/docker-production.md, TLS).
    ports:
      - "${SOLVEIT_HTTP_BIND:-127.0.0.1}:${SOLVEIT_HTTP_PORT:-8080}:8080"
    networks: [edge, internal]
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 128M }

  frontend:
    <<: *hardened
    build:
      context: ../..
      dockerfile: infra/docker/frontend/Dockerfile
      target: prod
      args:
        VITE_SITE_URL: ${SOLVEIT_SITE_URL:-}
        VITE_API_BASE_URL: ${SOLVEIT_API_BASE_URL:-}
        # Fixed on purpose: the inquiry API channel stays off until the owner approves its
        # activation (privacy notice, retention, hosting, database). Change it only then.
        VITE_INQUIRY_API_ENABLED: "false"
        VITE_GOOGLE_SITE_VERIFICATION: ${SOLVEIT_GOOGLE_SITE_VERIFICATION:-}
    image: solveit-indonesia/frontend:${SOLVEIT_IMAGE_TAG:-local}
    read_only: true
    cap_drop: [ALL]
    tmpfs:
      - /tmp
    networks: [internal]
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 128M }

  backend:
    <<: [*hardened, *backend-env, *backend-tmpfs]
    build:
      context: ../..
      dockerfile: infra/docker/backend/Dockerfile
      target: prod
    image: solveit-indonesia/backend:${SOLVEIT_IMAGE_TAG:-local}
    environment:
      APP_KEY_FILE: /run/secrets/app_key
      DB_PASSWORD_FILE: /run/secrets/db_app_password
    secrets: [app_key, db_app_password]
    read_only: true
    cap_drop: [ALL]
    # PHP-FPM finishes running requests on SIGQUIT before it exits.
    stop_signal: SIGQUIT
    stop_grace_period: 30s
    # internal: public gateway and MySQL; admin-internal: the admin listener only.
    networks: [internal, admin-internal]
    depends_on:
      mysql:
        condition: service_healthy
        required: false
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 512M }

  migrate:
    <<: [*backend-env, *backend-tmpfs]
    image: solveit-indonesia/backend:${SOLVEIT_IMAGE_TAG:-local}
    profiles: [ops]
    environment:
      APP_KEY_FILE: /run/secrets/app_key
      DB_USERNAME: ${SOLVEIT_DB_MIGRATOR_USERNAME:-solveit_migrator}
      DB_PASSWORD_FILE: /run/secrets/db_migrator_password
    secrets: [app_key, db_migrator_password]
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command: ["php", "artisan", "migrate", "--force", "--no-interaction"]
    restart: "no"
    networks: [internal]
    depends_on:
      mysql:
        condition: service_healthy
        required: false

  mysql:
    <<: *hardened
    image: mysql:8.4.11
    profiles: [bundled-db]
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      # root exists only inside the container; the application never uses it.
      MYSQL_ROOT_HOST: localhost
    secrets: [mysql_root_password, db_migrator_password, db_app_password]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/initdb-production:/docker-entrypoint-initdb.d:ro
    # No ports: reachable only from the internal network.
    networks: [internal]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--host=127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 1G }


  # --- Admin console (B3.2d): prepared and validated, NOT deployed -----------------------------
  # Nothing here starts without --profile admin. No hostname, certificate, or admin account
  # exists; ADMIN_URL in the env file is a placeholder until the owner decides the hostname.
  admin:
    <<: *hardened
    profiles: [admin]
    build:
      context: ../..
      dockerfile: infra/docker/admin/Dockerfile
      target: prod
    image: solveit-indonesia/admin:${SOLVEIT_IMAGE_TAG:-local}
    read_only: true
    cap_drop: [ALL]
    tmpfs:
      - /tmp
    networks: [admin-internal]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 64M }

  admin-gateway:
    <<: [*hardened, *backend-env]
    image: nginxinc/nginx-unprivileged:1.30.6-alpine
    profiles: [admin]
    # The env file (not secret) provides ADMIN_URL; nginx/admin-origin.envsh derives the admin
    # host from it and stops the container unless it is an https:// origin. Only SOLVEIT_ADMIN_*
    # variables are substituted into the configuration.
    environment:
      NGINX_ENVSUBST_FILTER: "^SOLVEIT_ADMIN_"
      SOLVEIT_ADMIN_REAL_IP_FROM: ${SOLVEIT_ADMIN_REAL_IP_FROM:-}
    read_only: true
    cap_drop: [ALL]
    # The image renders its templates into conf.d at start; uid/gid 101 is nginx.
    tmpfs:
      - /tmp
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0755
    volumes:
      - ./nginx/admin-origin.envsh:/docker-entrypoint.d/18-solveit-admin-origin.envsh:ro
      - ./nginx/admin-gateway.conf.template:/etc/nginx/templates/admin-gateway.conf.template:ro
      - ./nginx/admin-gateway-routes.conf:/etc/nginx/solveit/admin-gateway-routes.conf:ro
    # Private by default: loopback only. Set SOLVEIT_ADMIN_BIND to a VPN or private interface
    # address, or keep loopback behind a TLS proxy or SSH tunnel; never 0.0.0.0 without an
    # allowlist in front (docs/development/docker-production.md, Admin privat).
    ports:
      - "${SOLVEIT_ADMIN_BIND:-127.0.0.1}:${SOLVEIT_ADMIN_PORT:-8090}:8080"
    networks: [admin-edge, admin-internal]
    depends_on:
      admin:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 128M }

networks:
  # Only the gateway joins edge, the network with a published port.
  edge:
  # No route to the internet or the host: backend, frontend, and MySQL talk only to each other.
  internal:
    internal: true
  # The admin listener's own networks: the public gateway, the website, and MySQL are on none of
  # them, so neither listener can reach the other side's containers.
  admin-edge:
  admin-internal:
    internal: true

volumes:
  mysql-data:

# Compose bind-mounts each file as it is (not encrypted) with its host mode, which applies inside
# the containers: www-data (uid 33) reads app_key and the database passwords, the MySQL image reads
# its secrets as uid 999. Keep the files readable (0444) inside a folder only the deploy user can
# open (0700). See docs/development/docker-production.md.
secrets:
  app_key:
    file: ${SOLVEIT_SECRETS_DIR:-./secrets}/app_key
  db_app_password:
    file: ${SOLVEIT_SECRETS_DIR:-./secrets}/db_app_password
  db_migrator_password:
    file: ${SOLVEIT_SECRETS_DIR:-./secrets}/db_migrator_password
  mysql_root_password:
    file: ${SOLVEIT_SECRETS_DIR:-./secrets}/mysql_root_password
