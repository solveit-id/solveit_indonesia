# Full-Docker development environment for Solveit Indonesia: Laravel API, React frontend, and
# MySQL 8.4, for contributors without PHP 8.5, Node 22, or MySQL 8.4 on their machine.
# Guide: docs/development/docker-development.md. From the repository root:
#   bash infra/docker/scripts/setup-dev.sh                    # once: secrets, .env files, build, migrate
#   docker compose -f infra/docker/compose.dev.yaml up -d     # daily
#
# MySQL is not defined here: backend/docker/mysql/compose.yaml stays the only definition of the
# local database and is included as is. This project uses the same name (solveit-indonesia), so
# Compose treats the existing container solveit-mysql and the volume solveit-mysql-data as its
# own: nothing is recreated or duplicated, and the native workflow (PHP on the host, MySQL on
# 127.0.0.1:3307) keeps working on the same database at the same time.
# Never run `down -v` on this project: it deletes solveit-mysql-data.
name: solveit-indonesia

include:
  - ../../backend/docker/mysql/compose.yaml

services:
  backend:
    build:
      context: ../..
      dockerfile: infra/docker/backend/Dockerfile
      target: dev
      args:
        SOLVEIT_UID: ${SOLVEIT_UID:-1000}
        SOLVEIT_GID: ${SOLVEIT_GID:-1000}
    image: solveit-indonesia/backend:dev
    # A minimal init forwards stop signals, so `stop` ends the dev server at once.
    init: true
    # backend/.env and backend/.env.testing are shared with the native workflow. Inside Docker
    # only the address of MySQL differs: the service name and its internal port. Variables set
    # here win over both files, so credentials stay in the files and nowhere else.
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
    ports:
      - "127.0.0.1:${SOLVEIT_BACKEND_PORT:-8000}:8000"
    volumes:
      - ../../backend:/var/www/html
      # Linux dependencies stay in volumes, never mixed with a vendor/ installed on the host.
      - backend-vendor:/var/www/html/vendor
      - composer-cache:/var/cache/composer
      # Read by tests/Unit/Enums/FrontendContractTest.php (enum values shared with the website).
      - ../../frontend/src/types:/var/www/frontend/src/types:ro
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/frontend/Dockerfile
      target: dev
      args:
        SOLVEIT_UID: ${SOLVEIT_UID:-1000}
        SOLVEIT_GID: ${SOLVEIT_GID:-1000}
    image: solveit-indonesia/frontend:dev
    init: true
    # No VITE_* here: the inquiry API channel stays off (frontend/.env.example). Docker Desktop
    # does not forward file events from Windows folders into containers, so the dev server
    # polls for changes there (hot reload); on Linux and macOS set SOLVEIT_WATCH_POLLING=false.
    environment:
      SOLVEIT_WATCH_POLLING: ${SOLVEIT_WATCH_POLLING:-true}
    ports:
      - "127.0.0.1:${SOLVEIT_FRONTEND_PORT:-5173}:5173"
    volumes:
      - ../../frontend:/app
      - frontend-node-modules:/app/node_modules

volumes:
  backend-vendor:
  composer-cache:
  frontend-node-modules:
