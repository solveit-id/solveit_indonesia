# Project-scoped Codex configuration. Codex loads it only after you trust this
# repository. It serves sessions started at the repository root. For backend work,
# start Codex in backend/: Codex reads AGENTS.md only from the root down to the
# working directory and skills only from the working directory up, so backend/AGENTS.md
# and backend/.agents/skills/ are invisible from the root. Inside backend/ the file
# generated by `php artisan boost:install --mcp` (backend/.codex/, ignored) applies.

[mcp_servers.laravel-boost]
command = "php"
args = ["backend/artisan", "boost:mcp"]
